
name: Build ZOONL LIVE APK
# Trigger a fresh verification build for the current beauty-engine changes.
# Re-run after pull request was marked ready for review.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/progressive-levels-3d-chat

permissions:
  contents: read

concurrency:
  group: zoonl-live-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter
        run: flutter doctor -v

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name zoonl_live --org com.zoonllive /tmp/zoonl-live-scaffold
          cp -R /tmp/zoonl-live-scaffold/android "$GITHUB_WORKSPACE/android"
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in (Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")):
              if not path.exists():
                  continue
              source = path.read_text()
              if path.suffix == ".kts":
                  source, count = re.subn(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", source)
              else:
                  source, count = re.subn(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", source)
              if count:
                  path.write_text(source)
                  print(f"Set ML Kit minimum Android SDK to 23 in {path}")
                  break
          else:
              raise SystemExit("Could not locate generated Android minSdk setting.")
          PY

      - name: Install ZOONL native outgoing-video Beauty processor
        run: |
          PACKAGE_DIR="android/app/src/main/java/com/zoonllive/zoonl_live"
          KOTLIN_DIR="android/app/src/main/kotlin/com/zoonllive/zoonl_live"
          mkdir -p "$PACKAGE_DIR" "$KOTLIN_DIR"
          cat > "$PACKAGE_DIR/VideoProcessorSample.java" <<'JAVA'
          package com.zoonllive.zoonl_live;

          import androidx.annotation.NonNull;
          import com.cloudwebrtc.webrtc.FlutterWebRTCPlugin;
          import com.cloudwebrtc.webrtc.LocalTrack;
          import com.cloudwebrtc.webrtc.video.LocalVideoTrack;
          import org.webrtc.JavaI420Buffer;
          import org.webrtc.VideoFrame;
          import org.webrtc.YuvHelper;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.face.Face;
          import com.google.mlkit.vision.face.FaceDetection;
          import com.google.mlkit.vision.face.FaceDetector;
          import com.google.mlkit.vision.face.FaceDetectorOptions;
          import android.graphics.Rect;
          import android.graphics.PointF;
          import com.google.mlkit.vision.face.FaceContour;
          import java.nio.ByteBuffer;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.concurrent.atomic.AtomicBoolean;
          import java.util.Map;
          import io.flutter.plugin.common.BinaryMessenger;
          import io.flutter.plugin.common.MethodCall;
          import io.flutter.plugin.common.MethodChannel;

          /** Native YUV frame processor attached to flutter_webrtc's camera source. */
          public final class VideoProcessorSample implements MethodChannel.MethodCallHandler {
            private static final class BeautyProcessor implements LocalVideoTrack.ExternalVideoFrameProcessing {
              volatile double smoothing, glow, brightness, warmth, intensity;
              volatile String look = "Natural";
              private final FaceDetector faceDetector;
              private final AtomicBoolean faceDetectionBusy = new AtomicBoolean(false);
              private volatile float[] faceContourX = new float[0];
              private volatile float[] faceContourY = new float[0];
              private volatile long lastFaceDetectionNs = 0L;

              BeautyProcessor() {
                FaceDetectorOptions options = new FaceDetectorOptions.Builder()
                    .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_FAST)
                    .setLandmarkMode(FaceDetectorOptions.LANDMARK_MODE_NONE)
                    .setContourMode(FaceDetectorOptions.CONTOUR_MODE_ALL)
                    .setClassificationMode(FaceDetectorOptions.CLASSIFICATION_MODE_NONE)
                    .enableTracking()
                    .build();
                faceDetector = FaceDetection.getClient(options);
              }

              private void detectFace(VideoFrame.I420Buffer src, int width, int height, long timestampNs) {
                if (faceDetectionBusy.get() || timestampNs - lastFaceDetectionNs < 120_000_000L) return;
                if (!faceDetectionBusy.compareAndSet(false, true)) return;
                lastFaceDetectionNs = timestampNs;
                try {
                  int cw = (width + 1) / 2, ch = (height + 1) / 2;
                  byte[] nv21 = new byte[width * height + 2 * cw * ch];
                  ByteBuffer y = src.getDataY(), u = src.getDataU(), v = src.getDataV();
                  int yi = 0;
                  for (int row = 0; row < height; row++)
                    for (int col = 0; col < width; col++)
                      nv21[yi++] = y.get(row * src.getStrideY() + col);
                  int ci = width * height;
                  for (int row = 0; row < ch; row++) {
                    for (int col = 0; col < cw; col++) {
                      nv21[ci++] = v.get(row * src.getStrideV() + col);
                      nv21[ci++] = u.get(row * src.getStrideU() + col);
                    }
                  }
                  InputImage image = InputImage.fromByteArray(
                      nv21, width, height, 0, InputImage.IMAGE_FORMAT_NV21);
                  faceDetector.process(image)
                      .addOnSuccessListener(faces -> {
                        Face largest = null;
                        int largestArea = 0;
                        for (Face face : faces) {
                          Rect bounds = face.getBoundingBox();
                          int area = Math.max(0, bounds.width()) * Math.max(0, bounds.height());
                          if (area > largestArea) { largestArea = area; largest = face; }
                        }
                        if (largest == null || largest.getContour(FaceContour.FACE) == null) {
                          faceContourX = new float[0];
                          faceContourY = new float[0];
                        } else {
                          java.util.List<PointF> points = largest.getContour(FaceContour.FACE).getPoints();
                          float[] xs = new float[points.size()];
                          float[] ys = new float[points.size()];
                          for (int i = 0; i < points.size(); i++) {
                            xs[i] = points.get(i).x / (float) width;
                            ys[i] = points.get(i).y / (float) height;
                          }
                          faceContourX = xs;
                          faceContourY = ys;
                        }
                      })
                      .addOnCompleteListener(task -> faceDetectionBusy.set(false));
                } catch (Exception error) {
                  faceDetectionBusy.set(false);
                }
              }

              private static boolean insideFaceContour(float x, float y, float[] xs, float[] ys) {
                if (xs.length < 3 || xs.length != ys.length) return false;
                boolean inside = false;
                for (int i = 0, j = xs.length - 1; i < xs.length; j = i++) {
                  boolean crosses = ((ys[i] > y) != (ys[j] > y))
                      && (x < (xs[j] - xs[i]) * (y - ys[i])
                          / ((ys[j] - ys[i]) + 0.000001f) + xs[i]);
                  if (crosses) inside = !inside;
                }
                return inside;
              }

              void close() { faceDetector.close(); }

              void configure(MethodCall call) {
                smoothing = number(call, "smoothing", 0.15);
                glow = number(call, "glow", 0.1);
                brightness = number(call, "brightness", 0.0);
                warmth = number(call, "warmth", 0.0);
                intensity = number(call, "intensity", 0.35);
                Object value = call.argument("look");
                look = value == null ? "Natural" : value.toString();
              }

              private static double number(MethodCall call, String key, double fallback) {
                Number value = call.argument(key);
                return value == null ? fallback : value.doubleValue();
              }

              @Override public VideoFrame onFrame(VideoFrame input) {
                final double smooth = Math.max(0.0, Math.min(1.0, smoothing)) * 0.42;
                double light = Math.max(0.0, Math.min(1.0, glow));
                final double lift = Math.max(-1.0, Math.min(1.0, brightness)) * 34.0;
                final double warm = Math.max(-1.0, Math.min(1.0, warmth));

                VideoFrame.I420Buffer src = input.getBuffer().toI420();
                if (src == null) return input;
                final int width = src.getWidth(), height = src.getHeight();
                detectFace(src, width, height, input.getTimestampNs());
                final int cw = (width + 1) / 2, ch = (height + 1) / 2;
                final float[] contourX = faceContourX;
                final float[] contourY = faceContourY;
                JavaI420Buffer dst = JavaI420Buffer.allocate(width, height);
                double amount = Math.max(0.0, Math.min(1.0, intensity));
                double saturation = 1.0;
                double contrast = 1.0;
                double toneWarmth = warm;
                if ("Vivid".equals(look)) { saturation = 1.0 + 0.78 * amount; contrast = 1.0 + 0.18 * amount; }
                else if ("Cinema".equals(look)) { saturation = 1.0 - 0.28 * amount; contrast = 1.0 + 0.30 * amount; }
                else if ("Warm".equals(look)) { saturation = 1.0 + 0.18 * amount; toneWarmth += 0.72 * amount; }
                else if ("Sunset".equals(look)) { saturation = 1.0 + 0.30 * amount; toneWarmth += 1.10 * amount; }
                else if ("Cool".equals(look)) { saturation = 1.0 + 0.10 * amount; toneWarmth -= 0.72 * amount; }
                else if ("Ice".equals(look)) { saturation = 1.0 - 0.12 * amount; toneWarmth -= 1.15 * amount; }
                else if ("Rose".equals(look)) { saturation = 1.0 + 0.24 * amount; toneWarmth += 0.48 * amount; }
                else if ("Peach".equals(look)) { saturation = 1.0 + 0.20 * amount; toneWarmth += 0.82 * amount; }
                else if ("Mint".equals(look)) { saturation = 1.0 + 0.20 * amount; toneWarmth -= 0.42 * amount; }
                else if ("Lavender".equals(look)) { saturation = 1.0 + 0.16 * amount; toneWarmth -= 0.62 * amount; }
                else if ("Mono".equals(look)) { saturation = 1.0 - amount; }
                if ("Soft Glow".equals(look)) { light = Math.min(1.0, light + 0.62 * amount); }

                ByteBuffer sy = src.getDataY(), dy = dst.getDataY();
                int ss = src.getStrideY(), ds = dst.getStrideY();
                for (int row = 0; row < height; row++) {
                  for (int col = 0; col < width; col++) {
                    int center = sy.get(row * ss + col) & 255;
                    double value = center;
                    int chromaIndex = (row / 2) * src.getStrideU() + (col / 2);
                    int skinU = src.getDataU().get(chromaIndex) & 255;
                    int skinV = src.getDataV().get(chromaIndex) & 255;
                    float nx = col / (float) width, ny = row / (float) height;
                    boolean inFace = insideFaceContour(nx, ny, contourX, contourY);
                    boolean skinPixel = inFace && center > 48 && center < 238
                        && skinU >= 72 && skinU <= 142 && skinV >= 128 && skinV <= 190;
                    if (smooth > 0.001 && skinPixel) {
                      // Edge-preserving local smoothing, limited to skin-toned pixels.
                      int sum = center * 2, count = 2;
                      if (col > 0) {
                        int neighbor = sy.get(row * ss + col - 1) & 255;
                        if (Math.abs(neighbor - center) < 22) { sum += neighbor; count++; }
                      }
                      if (col + 1 < width) {
                        int neighbor = sy.get(row * ss + col + 1) & 255;
                        if (Math.abs(neighbor - center) < 22) { sum += neighbor; count++; }
                      }
                      if (row > 0) {
                        int neighbor = sy.get((row - 1) * ss + col) & 255;
                        if (Math.abs(neighbor - center) < 22) { sum += neighbor; count++; }
                      }
                      if (row + 1 < height) {
                        int neighbor = sy.get((row + 1) * ss + col) & 255;
                        if (Math.abs(neighbor - center) < 22) { sum += neighbor; count++; }
                      }
                      value = center * (1.0 - smooth) + (sum / (double) count) * smooth;
                    }
                    value += lift;
                    if (skinPixel) {
                      // Face-only skin brightening: never lift the whole frame to fake whitening.
                      value += (255.0 - value) * Math.min(0.16, amount * 0.12);
                    }
                    value += Math.max(0.0, value - 112.0) * light * 0.075;
                    value = 128.0 + (value - 128.0) * contrast;
                    dy.put(row * ds + col, (byte) Math.max(0, Math.min(255, (int) Math.round(value))));
                  }
                }

                ByteBuffer su = src.getDataU(), sv = src.getDataV();
                ByteBuffer du = dst.getDataU(), dv = dst.getDataV();
                int us = src.getStrideU(), vs = src.getStrideV();
                int dus = dst.getStrideU(), dvs = dst.getStrideV();
                for (int row = 0; row < ch; row++) {
                  for (int col = 0; col < cw; col++) {
                    int ui = row * us + col, vi = row * vs + col;
                    double u = 128.0 + ((su.get(ui) & 255) - 128.0) * saturation - toneWarmth * 18.0;
                    double v = 128.0 + ((sv.get(vi) & 255) - 128.0) * saturation + toneWarmth * 24.0;
                    du.put(row * dus + col, (byte) Math.max(0, Math.min(255, (int) Math.round(u))));
                    dv.put(row * dvs + col, (byte) Math.max(0, Math.min(255, (int) Math.round(v))));
                  }
                }
                src.release();
                return new VideoFrame(dst, input.getRotation(), input.getTimestampNs());
              }
            }

            private final MethodChannel channel;
            private final Map<String, BeautyProcessor> processors = new HashMap<>();

            VideoProcessorSample(BinaryMessenger messenger) {
              channel = new MethodChannel(messenger, "zoonl.live/beauty");
              channel.setMethodCallHandler(this);
            }

            private static LocalVideoTrack findTrack(String id) {
              FlutterWebRTCPlugin plugin = FlutterWebRTCPlugin.sharedSingleton;
              LocalTrack track = plugin == null ? null : plugin.getLocalTrack(id);
              return track instanceof LocalVideoTrack ? (LocalVideoTrack) track : null;
            }

            @Override public void onMethodCall(@NonNull MethodCall call, @NonNull MethodChannel.Result result) {
              String id = call.argument("trackId");
              if (id == null) { result.error("bad_args", "trackId is required", null); return; }
              if ("addBeauty".equals(call.method)) {
                BeautyProcessor processor = processors.get(id);
                if (processor == null) {
                  LocalVideoTrack track = findTrack(id);
                  if (track == null) { result.error("no_track", "Local camera track not found: " + id, null); return; }
                  processor = new BeautyProcessor();
                  track.addProcessor(processor);
                  processors.put(id, processor);
                }
                processor.configure(call);
                result.success(null);
              } else if ("removeBeauty".equals(call.method)) {
                BeautyProcessor processor = processors.remove(id);
                LocalVideoTrack track = findTrack(id);
                if (processor != null && track != null) track.removeProcessor(processor);
                if (processor != null) processor.close();
                result.success(processor != null);
              } else {
                result.notImplemented();
              }
            }

            void dispose() {
              for (Map.Entry<String, BeautyProcessor> entry : processors.entrySet()) {
                LocalVideoTrack track = findTrack(entry.getKey());
                if (track != null) track.removeProcessor(entry.getValue());
                entry.getValue().close();
              }
              processors.clear();
              channel.setMethodCallHandler(null);
            }
          }
          JAVA
          cat > "$KOTLIN_DIR/MainActivity.kt" <<'KOTLIN'
          package com.zoonllive.zoonl_live

          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine

          class MainActivity : FlutterActivity() {
            private var zoonlBeautyProcessor: VideoProcessorSample? = null

            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
              super.configureFlutterEngine(flutterEngine)
              zoonlBeautyProcessor = VideoProcessorSample(flutterEngine.dartExecutor.binaryMessenger)
            }

            override fun cleanUpFlutterEngine(flutterEngine: FlutterEngine) {
              zoonlBeautyProcessor?.dispose()
              zoonlBeautyProcessor = null
              super.cleanUpFlutterEngine(flutterEngine)
            }
          }
          KOTLIN
          echo "ZOONL Android native outgoing-frame processor installed."
      - name: Download ZOONL brand logo
        run: |
          mkdir -p assets/branding
          curl --fail --location --retry 3 --retry-all-errors \
            "https://ewzdhminqdldilydrpmk.supabase.co/storage/v1/object/public/avatars/ZOONL%20Streaming%20Logo_20261122_110907_0001.png" \
            --output assets/branding/zoonl_logo.png
          file assets/branding/zoonl_logo.png
          test -s assets/branding/zoonl_logo.png

      - name: Apply ZOONL Android launcher and splash branding
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp assets/branding/zoonl_logo.png android/app/src/main/res/drawable-nodpi/zoonl_splash_logo.png
          for item in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${item%%:*}"
            size="${item##*:}"
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            convert assets/branding/zoonl_logo.png -thumbnail "${size}x${size}" \
              -gravity center -background "#080510" -extent "${size}x${size}" \
              "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done
          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/black"/>
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/zoonl_splash_logo"/>
              </item>
          </layer-list>
          EOF

      - name: Ensure Gradle plugin repositories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle.kts")
          s = p.read_text()
          match = re.search(r"pluginManagement\s*\{", s)
          if not match:
              raise SystemExit("pluginManagement block was not generated.")
          start = match.end()
          repo_match = re.search(r"repositories\s*\{", s[start:])
          if not repo_match:
              raise SystemExit("pluginManagement repositories block was not generated.")
          repo_start = start + repo_match.end()
          close = s.find("}", repo_start)
          if close < 0:
              raise SystemExit("Could not locate plugin repository block end.")
          block = s[repo_start:close]
          additions = []
          if "google()" not in block:
              additions.append("google()")
          if "mavenCentral()" not in block:
              additions.append("mavenCentral()")
          if "gradlePluginPortal()" not in block:
              additions.append("gradlePluginPortal()")
          if additions:
              s = s[:repo_start] + "\n" + "\n".join("        " + item for item in additions) + "\n" + s[repo_start:]
              p.write_text(s)
          print("Gradle plugin resolution repositories verified.")
          PY

      - name: Verify Android minimum SDK for native video filters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          target = next((p for p in candidates if p.exists()), None)
          if target is None:
              raise SystemExit("Android app Gradle file was not generated.")
          source = target.read_text()
          if target.suffix == ".kts":
              source, count = re.subn(r"minSdk\s*=\s*(?:flutter\.minSdkVersion|\d+)", "minSdk = 23", source, count=1)
          else:
              source, count = re.subn(r"minSdkVersion\s+(?:flutter\.minSdkVersion|\d+)", "minSdkVersion 23", source, count=1)
          if count:
              target.write_text(source)
          if not re.search(r"minSdk\s*=\s*23", source) and not re.search(r"minSdkVersion\s+23", source):
              raise SystemExit(f"Could not verify minSdkVersion 23 in {target}")
          print(f"Android minSdkVersion verified at 23 in {target}")
          PY

      - name: Add Android Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>',
          ]

          for permission in permissions:
              if permission not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)

          deep_link = """        <intent-filter>
                      <action android:name="android.intent.action.VIEW"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <category android:name="android.intent.category.BROWSABLE"/>
                      <data android:scheme="io.supabase.flutter" android:host="login-callback"/>
                  </intent-filter>
          """

          if 'android:scheme="io.supabase.flutter"' not in s:
              activity_end = s.find('</activity>')
              if activity_end < 0:
                  raise SystemExit("Main Android activity was not found.")
              s = s[:activity_end] + deep_link + s[activity_end:]

          p.write_text(s)
          print("Internet, Camera, Microphone, audio permissions, and Supabase OAuth deep link configured.")
          PY

      - name: Expose flutter_webrtc native classes to app processor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          target = next((p for p in candidates if p.exists()), None)
          if target is None:
              raise SystemExit("Android app Gradle file was not generated.")
          source = target.read_text()
          coordinates = [
              "io.github.webrtc-sdk:android:137.7151.04",
              "com.google.mlkit:face-detection:16.1.7",
          ]
          for coordinate in coordinates:
              if coordinate in source:
                  print(f"Dependency already present: {coordinate}")
                  continue
              line = (f'    implementation("{coordinate}")' if target.suffix == ".kts"
                      else f"    implementation '{coordinate}'")
              match = re.search(r"dependencies\s*\{", source)
              if match:
                  source = source[:match.end()] + "\n" + line + "\n" + source[match.end():]
              else:
                  source = source.rstrip() + "\n\ndependencies {\n" + line + "\n}\n"
          target.write_text(source)
          for coordinate in coordinates:
              if coordinate not in target.read_text():
                  raise SystemExit(f"Dependency injection did not persist: {coordinate}")
          print(f"Added WebRTC and bundled ML Kit face detection dependencies to {target}.")
          PY

      - name: Clean project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Gradle lint
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/disable-release-lint.gradle" <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  if (task.name == 'lintVitalAnalyzeRelease') {
                      task.enabled = false
                  }
              }
          }
          EOF

      - name: Install Android NDK with clean retry
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          installed=0
          for attempt in 1 2 3 4; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/4)"
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            rm -rf "$SDK_ROOT/.temp/"* "$SDK_ROOT/temp/"* 2>/dev/null || true
            # sdkmanager closes stdin after accepting its license prompt;
            # the 'yes' process can then report SIGPIPE (141) even when the
            # NDK download and extraction succeeded. Do not let pipefail
            # mistake that expected SIGPIPE for an installation failure.
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION" || true
            set -o pipefail
            if test -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties"; then
              installed=1
              break
            fi
            sleep $((attempt * 12))
          done
          if [ "$installed" -ne 1 ]; then
            echo "Android NDK $NDK_VERSION could not be installed after retries."
            exit 1
          fi
          cat "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" | grep "Pkg.Revision"

      - name: Build release APK
        run: flutter build apk --release -t lib/app_entry.dart

      - name: Package APK ZIP
        run: |
          cd build/app/outputs/flutter-apk
          printf 'ZOONL LIVE Android release\\nCommit: %s\\n' "$GITHUB_SHA" > README.txt
          zip -9 zoonl-live-release.zip app-release.apk README.txt
          sha256sum app-release.apk zoonl-live-release.zip

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zoonl-live-release-zip
          path: build/app/outputs/flutter-apk/zoonl-live-release.zip
          if-no-files-found: error
          retention-days: 7
