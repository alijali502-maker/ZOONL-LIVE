
name: Build ZOONL LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter
        run: flutter doctor -v

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name zoonl_live --org com.zoonllive /tmp/zoonl-live-scaffold
          cp -R /tmp/zoonl-live-scaffold/android "$GITHUB_WORKSPACE/android"

      - name: Add Android Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in s:
              s = s.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )
              p.write_text(s)

          print("Internet permission configured.")
          PY

      - name: Clean project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Gradle lint
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/disable-release-lint.gradle" <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  if (task.name == 'lintVitalAnalyzeRelease') {
                      task.enabled = false
                  }
              }
          }
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zoonl-live-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

