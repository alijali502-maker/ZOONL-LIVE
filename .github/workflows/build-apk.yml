
name: Build ZOONL LIVE APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/video-live-room-ui

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter
        run: flutter doctor -v

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name zoonl_live --org com.zoonllive /tmp/zoonl-live-scaffold
          cp -R /tmp/zoonl-live-scaffold/android "$GITHUB_WORKSPACE/android"

      - name: Add Android Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>',
          ]

          for permission in permissions:
              if permission not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)

          deep_link = """        <intent-filter>
                      <action android:name="android.intent.action.VIEW"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <category android:name="android.intent.category.BROWSABLE"/>
                      <data android:scheme="io.supabase.flutter" android:host="login-callback"/>
                  </intent-filter>
          """

          if 'android:scheme="io.supabase.flutter"' not in s:
              activity_end = s.find('</activity>')
              if activity_end < 0:
                  raise SystemExit("Main Android activity was not found.")
              s = s[:activity_end] + deep_link + s[activity_end:]

          p.write_text(s)
          print("Internet, Camera, Microphone, audio permissions, and Supabase OAuth deep link configured.")
          PY

      - name: Configure Model Viewer Android requirements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              if p.exists():
                  s = p.read_text()
                  s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")
                  p.write_text(s)
          print("Model Viewer Android minSdk configured.")
          PY

      - name: Clean project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Gradle lint
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/disable-release-lint.gradle" <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  if (task.name == 'lintVitalAnalyzeRelease') {
                      task.enabled = false
                  }
              }
          }
          EOF

      - name: Build release APK
        run: flutter build apk --release -t lib/app_entry.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zoonl-live-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
