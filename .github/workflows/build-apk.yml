
import 'package:flutter/material.dart';

void main() {
  runApp(const ZoonlLive());
}

class ZoonlLive extends StatelessWidget {
  const ZoonlLive({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'ZOONL LIVE',
      theme: ThemeData.dark().copyWith(
        scaffoldBackgroundColor: const Color(0xFF090914),
        colorScheme: const ColorScheme.dark(
          primary: Color(0xFFE7B85C),
        ),
      ),
      home: const HomeScreen(),
    );
  }
}

class HomeScreen extends StatefulWidget {
  const HomeScreen({super.key});

  @override
  State<HomeScreen> createState() => _HomeScreenState();
}

class _HomeScreenState extends State<HomeScreen> {
  int selectedTab = 0;

  final List<Map<String, dynamic>> gifts = [
    {'name': 'Royal Lion', 'price': '50000', 'icon': Icons.pets},
    {'name': 'Luxury Car', 'price': '30000', 'icon': Icons.directions_car},
    {'name': 'Diamond Ring', 'price': '20000', 'icon': Icons.diamond},
    {'name': 'Royal Castle', 'price': '80000', 'icon': Icons.castle},
    {'name': 'Golden Crown', 'price': '15000', 'icon': Icons.workspace_premium},
    {'name': 'Love Proposal', 'price': '10000', 'icon': Icons.favorite},
  ];

  void showGifts() {
    showModalBottomSheet(
      context: context,
      isScrollControlled: true,
      backgroundColor: const Color(0xFF171525),
      builder: (context) {
        return SizedBox(
          height: MediaQuery.of(context).size.height * 0.72,
          child: Padding(
            padding: const EdgeInsets.all(18),
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                const Center(
                  child: Text(
                    'PREMIUM GIFT COLLECTION',
                    style: TextStyle(
                      color: Color(0xFFE7B85C),
                      fontSize: 18,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ),
                const SizedBox(height: 20),
                Expanded(
                  child: GridView.builder(
                    itemCount: gifts.length,
                    gridDelegate:
                        const SliverGridDelegateWithFixedCrossAxisCount(
                      crossAxisCount: 3,
                      childAspectRatio: 0.82,
                      crossAxisSpacing: 10,
                      mainAxisSpacing: 10,
                    ),
                    itemBuilder: (context, index) {
                      final gift = gifts[index];
                      return Container(
                        decoration: BoxDecoration(
                          borderRadius: BorderRadius.circular(16),
                          border: Border.all(
                            color: const Color(0xFFB68A42),
                          ),
                          gradient: const LinearGradient(
                            colors: [
                              Color(0xFF30233F),
                              Color(0xFF171525),
                            ],
                          ),
                        ),
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            Icon(
                              gift['icon'] as IconData,
                              size: 42,
                              color: const Color(0xFFE7B85C),
                            ),
                            const SizedBox(height: 8),
                            Text(
                              gift['name'] as String,
                              textAlign: TextAlign.center,
                              style: const TextStyle(
                                fontWeight: FontWeight.bold,
                                fontSize: 12,
                              ),
                            ),
                            const SizedBox(height: 5),
                            Text(
                              '${gift['price']} Coins',
                              style: const TextStyle(
                                color: Color(0xFFE7B85C),
                                fontSize: 11,
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  ),
                ),
              ],
            ),
          ),
        );
      },
      child: Text(
        title,
        style: const TextStyle(
          fontSize: 19,
          fontWeight: FontWeight.bold,
        ),
      ),
    );
  }

  Widget liveCard(String name, String viewers, Color color) {
    return Container(
      width: 155,
      margin: const EdgeInsets.only(right: 12),
      decoration: BoxDecoration(
        borderRadius: BorderRadius.circular(18),
        gradient: LinearGradient(
          begin: Alignment.topLeft,
          end: Alignment.bottomRight,
          colors: [color, const Color(0xFF171525)],
        ),
        border: Border.all(color: Colors.white24),
      ),
      child: Padding(
        padding: const EdgeInsets.all(12),
        child: Column(
          mainAxisAlignment: MainAxisAlignment.end,
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            const Icon(Icons.person, size: 55, color: Colors.white70),
            const Spacer(),
            const Text(
              'LIVE NOW',
              style: TextStyle(
                color: Colors.redAccent,
                fontWeight: FontWeight.bold,
                fontSize: 11,
              ),
            ),
            Text(
              name,
              style: const TextStyle(
                fontWeight: FontWeight.bold,
                fontSize: 15,
              ),
            ),
            Text(
              '$viewers viewers',
              style: const TextStyle(color: Colors.white70, fontSize: 11),
            ),
          ],
        ),
      ),
    );
  }

  Widget homeContent() {
    return ListView(
      padding: const EdgeInsets.all(16),
      children: [
        Container(
          padding: const EdgeInsets.all(18),
          decoration: BoxDecoration(
            borderRadius: BorderRadius.circular(20),
            gradient: const LinearGradient(
              colors: [Color(0xFF49304F), Color(0xFF171525)],
            ),
            border: Border.all(color: const Color(0xFFB68A42)),
          ),
          child: const Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              Text(
                'WELCOME TO',
                style: TextStyle(
                  color: Color(0xFFE7B85C),
                  letterSpacing: 3,
                ),
              ),
              SizedBox(height: 7),
              Text(
                'ZOONL LIVE',
                style: TextStyle(
                  fontSize: 28,
                  fontWeight: FontWeight.w900,
                  color: Color(0xFFE7B85C),
                ),
              ),
              SizedBox(height: 7),
              Text('Connect • Stream • Share'),
            ],
          ),
        ),
        sectionTitle('Live Rooms'),
        SizedBox(
          height: 190,
          child: ListView(
            scrollDirection: Axis.horizontal,
            children: [
              liveCard('Royal Room', '1.2K', const Color(0xFF6D315A)),
              liveCard('Music Lounge', '850', const Color(0xFF254B69)),
              liveCard('Friends Club', '520', const Color(0xFF654526)),
            ],
          ),
        ),
        sectionTitle('Premium Gifts'),
        GridView.builder(
          shrinkWrap: true,
          physics: const NeverScrollableScrollPhysics(),
          itemCount: gifts.length,
          gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
            crossAxisCount: 3,
            childAspectRatio: 0.9,
            crossAxisSpacing: 10,
            mainAxisSpacing: 10,
          ),
          itemBuilder: (context, index) {
            final gift = gifts[index];
            return Container(
              decoration: BoxDecoration(
                color: const Color(0xFF191727),
                borderRadius: BorderRadius.circular(15),
                border: Border.all(color: const Color(0xFF8E6A39)),
              ),
              child: Column(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  Icon(
                    gift['icon'] as IconData,
                    color: const Color(0xFFE7B85C),
                    size: 34,
                  ),
                  const SizedBox(height: 8),
                  Text(
                    gift['name'] as String,
                    textAlign: TextAlign.center,
                    style: const TextStyle(fontSize: 11),
                  ),
                ],
              ),
            );
          },
        ),
        const SizedBox(height: 18),
        SizedBox(
          height: 48,
          child: ElevatedButton(
            onPressed: showGifts,
            style: ElevatedButton.styleFrom(
              backgroundColor: const Color(0xFFE7B85C),
              foregroundColor: Colors.black,
            ),
            child: const Text(
              'OPEN GIFT COLLECTION',
              style: TextStyle(fontWeight: FontWeight.bold),
            ),
          ),
        ),
      ],
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        backgroundColor: const Color(0xFF090914),
        title: const Text(
          'ZOONL LIVE',
          style: TextStyle(
            color: Color(0xFFE7B85C),
            fontWeight: FontWeight.w900,
            letterSpacing: 2,
          ),
        ),
        actions: [
          IconButton(
            onPressed: showGifts,
            icon: const Icon(
              Icons.card_giftcard,
              color: Color(0xFFE7B85C),
            ),
          ),
          IconButton(
            onPressed: () {},
            icon: const Icon(Icons.account_balance_wallet),
          ),
        ],
      ),
      body: homeContent(),
      bottomNavigationBar: BottomNavigationBar(
        currentIndex: selectedTab,
        onTap: (index) {
          setState(() => selectedTab = index);
          if (index == 2) showGifts();
        },
        type: BottomNavigationBarType.fixed,
        backgroundColor: const Color(0xFF171525),
        selectedItemColor: const Color(0xFFE7B85C),
        unselectedItemColor: Colors.white54,
        items: const [
          BottomNavigationBarItem(
            icon: Icon(Icons.home),
            label: 'Home',
          ),
          BottomNavigationBarItem(
            icon: Icon(Icons.live_tv),
            label: 'Live',
          ),
          BottomNavigationBarItem(
            icon: Icon(Icons.card_giftcard),
            label: 'Gifts',
          ),
          BottomNavigationBarItem(
            icon: Icon(Icons.person),
            label: 'Profile',
          ),
        ],
      ),
    );
  }
}
